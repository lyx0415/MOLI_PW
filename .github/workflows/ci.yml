name: Platform checks
on:
  pull_request:
  push:
    branches: [master, 'codex/**']
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm test
        env:
          TEST_DB_DRIVER: mysql
          TEST_DB_PORT: '3307'
          TEST_DB_PASSWORD: ci-only-password
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
          PLAYWRIGHT_CHANNEL: chromium
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
